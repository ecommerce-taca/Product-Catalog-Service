# mongod.conf
# MongoDB 8.x Configuration for Product Catalog Service Replica Set
# Architecture Ref: tensura/docs/architecture.md §4.3, §13.2
# Database Design Ref: tensura/docs/database-design.md §7.2, §14.2 (Decision DB2)

# Where and how to store data
storage:
  dbPath: /data/db
  journal:
    enabled: true
  # DB2: Minimum retention time for oplog to survive 72-hour downtime (weekend/holiday safety window)
  oplogMinRetentionHours: 72
  wiredTiger:
    engineConfig:
      # Sized for 16GB RAM production host (50% of RAM - 1GB ~ 7GB cache)
      cacheSizeGB: 7
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# Network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0
  # Max concurrent incoming connections (well above peak ~220 connections)
  maxIncomingConnections: 1000

# Process management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# System logging
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

# Replication configuration
replication:
  replSetName: "rs0"
  # DB2: Pre-allocated 64 GB disk space for Oplog buffer
  oplogSizeMB: 65536

# Operation profiling for query monitoring
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100
